[versions]
agp = "8.10.1"
kotlin = "2.2.21"
compose = "2025.04.01"
activity = "1.10.1"
lifecycle = "2.8.7"
coroutines = "1.10.2"
serialization = "1.8.1"
okhttp = "4.12.0"
work = "2.10.1"
core = "1.15.0"
zxing = "4.3.0"
litert = "0.16.1"
junit = "4.13.2"

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }

[libraries]
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-icons = { module = "androidx.compose.material:material-icons-extended" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
kotlin-coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlin-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
work-runtime = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }
android-core = { module = "androidx.core:core-ktx", version.ref = "core" }
zxing = { module = "com.journeyapps:zxing-android-embedded", version.ref = "zxing" }
litert = { module = "com.google.ai.edge.litertlm:litertlm-android", version.ref = "litert" }
junit = { module = "junit:junit", version.ref = "junit" }
