services:
  api:
    environment:
      CAMARA_API_KEY: ""
      CAMARA_PREVIOUS_API_KEY: ""
      OPENROUTER_API_KEY: ""
      GROQ_API_KEY: ""
      CAMARA_API_KEY_FILE: /run/secrets/camara_api_key
      CAMARA_PREVIOUS_API_KEY_FILE: /run/secrets/camara_previous_api_key
      OPENROUTER_API_KEY_FILE: /run/secrets/openrouter_api_key
      GROQ_API_KEY_FILE: /run/secrets/groq_api_key
    secrets:
      - camara_api_key
      - camara_previous_api_key
      - openrouter_api_key
      - groq_api_key
secrets:
  camara_api_key:
    file: ${CAMARA_SECRETS_DIR:-./secrets}/camara_api_key
  camara_previous_api_key:
    file: ${CAMARA_SECRETS_DIR:-./secrets}/camara_previous_api_key
  openrouter_api_key:
    file: ${CAMARA_SECRETS_DIR:-./secrets}/openrouter_api_key
  groq_api_key:
    file: ${CAMARA_SECRETS_DIR:-./secrets}/groq_api_key
