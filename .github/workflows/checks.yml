name: Verificări
on: [push, pull_request]
permissions:
  contents: read
jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-lock.txt
      - name: Verifică versiunile și dependențele
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          requirements = {line.strip() for line in Path("requirements.txt").read_text(encoding="utf-8").splitlines() if line.strip()}
          lock = {line.strip() for line in Path("requirements-lock.txt").read_text(encoding="utf-8").splitlines() if line.strip()}
          assert requirements <= lock, f"Versiuni lipsă din lock: {sorted(requirements - lock)}"

          android = Path("../android/app/build.gradle.kts").read_text(encoding="utf-8")
          version = re.search(r'versionName\s*=\s*"([^"]+)"', android).group(1)
          readme = Path("../README.md").read_text(encoding="utf-8")
          assert f"Android **{version}**" in readme, f"README trebuie actualizat pentru Android {version}"
          PY
      - run: pip install -r requirements-dev.txt
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils tesseract-ocr-ron tesseract-ocr-eng
      - run: python -m pytest
      - run: docker build --quiet .
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - run: bash gradlew --console=plain :app:assembleDebug :app:assembleRelease :app:testReleaseUnitTest :app:lintRelease
